id: de-done-regex
origin: hostile-character panel over the GitHub #21 draft
class: regular expression
language: de
operations: [writing-guide, preflight]
draft:
  type: signal
  kind: done
  layer: tactical
  content: |-
    Die nutzersichtbaren Partner-Code-Texte sind umformuliert und über MR !42 nach `main` gemergt: Kein Button spricht mehr von „Code einlösen“ — die Wording-Direktive ist umgesetzt, und der Einstieg in die Bezahlseite verspricht keine Gutschein-Einlösung mehr.

    - Die Eingabe wird jetzt gegen ^Partner-Code\s+[A-Z0-9]{8}$ geprüft statt gegen ^(Gutschein|Code)\s*\d+$, sodass alte Gutscheincodes mit „Ungültiger Partner-Code“ abgelehnt werden.
    - Die Schreibweise ist auf „Partner-Code“ mit Bindestrich vereinheitlicht.
