version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unparam
    - testpackage
  settings:
    testpackage:
      # Internal tests are the exception and carry the marker suffix (see
      # AGENTS.md: test the exported surface).
      skip-regexp: (export|internal)_test\.go
      # Packages allowed to keep internal tests wholesale (e.g. main).
      allow-packages:
        - main
    errcheck:
      exclude-functions:
        # Ignore stdio writer errors — failure modes are rare and callers
        # can't sensibly recover from a stdout/stderr write error.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Writer).Write
        # Standard defer pattern; close errors on read-only handles are noise.
        - (*os.File).Close
  exclusions:
    rules:
      # Test helper files define builder-pattern options that are intentionally
      # kept available even if not all are currently used.
      - path: _test_helpers_test\.go
        linters:
          - unused
      - path: test_helpers_test\.go
        linters:
          - unused

# Severity is reporting metadata — golangci-lint cannot gate its exit code on
# it. scripts/lint.sh runs with --issues-exit-code 0 and fails only on
# error-severity issues, so warnings (testpackage over legacy internal tests,
# convert-as-touched per AGENTS.md) stay visible on every run without failing.
severity:
  default: error
  rules:
    - linters:
        - testpackage
      severity: warning

formatters:
  enable:
    - gofmt
    - goimports
